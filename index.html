<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sivaprabhakaran - AI & Data Science Portfolio</title>
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary-color: #6C63FF;
            --secondary-color: #1E1E2E;
            --accent-color: #FF6B6B;
            --dark-bg: #121212;
            --card-bg: #1E1E2E;
            --text-color: #E4E4E6;
            --text-muted: #A0A0A0;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            --transition: all 0.3s ease;
        }

        body {
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--dark-bg);
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header Styles */
        header {
            background-color: rgba(30, 30, 46, 0.9);
            color: white;
            padding: 1rem 0;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            text-decoration: none;
        }

        .logo span {
            color: var(--primary-color);
        }

        .nav-links {
            display: flex;
            list-style: none;
        }

        .nav-links li {
            margin-left: 2rem;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
            position: relative;
        }

        .nav-links a:hover {
            color: var(--primary-color);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -5px;
            left: 0;
            background-color: var(--primary-color);
            transition: var(--transition);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .hamburger {
            display: none;
            cursor: pointer;
            font-size: 1.5rem;
        }

        /* Hero Section */
        .hero {
            padding: 180px 0 100px;
            background: linear-gradient(135deg, var(--secondary-color), var(--dark-bg));
            color: white;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(108, 99, 255, 0.1) 0%, rgba(108, 99, 255, 0) 70%);
            top: -250px;
            right: -100px;
        }

        .hero-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 50px;
        }

        .hero-text {
            flex: 1;
            text-align: left;
        }

        .hero-text .greeting {
            font-size: 1.2rem;
            color: var(--primary-color);
            margin-bottom: 10px;
            font-weight: 500;
        }

        .hero-text h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .hero-text h1 span {
            color: var(--primary-color);
        }

        .hero-text .title {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            color: var(--text-muted);
        }

        .hero-text p {
            font-size: 1.1rem;
            max-width: 500px;
            margin-bottom: 2.5rem;
            color: var(--text-muted);
        }

        .hero-buttons {
            display: flex;
            gap: 20px;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
            border: none;
            cursor: pointer;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: #5a52e0;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(108, 99, 255, 0.3);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-color);
            border: 2px solid var(--primary-color);
        }

        .btn-secondary:hover {
            background-color: rgba(108, 99, 255, 0.1);
            transform: translateY(-3px);
        }

        .hero-image {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile-container {
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 0 50px rgba(108, 99, 255, 0.3);
        }

        .profile-image {
            width: 340px;
            height: 340px;
            border-radius: 50%;
            background-color: var(--card-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .profile-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Section Styles */
        .section {
            padding: 100px 0;
        }

        .section-title {
            text-align: center;
            margin-bottom: 3rem;
        }

        .section-title h2 {
            font-size: 2.5rem;
            color: var(--text-color);
            position: relative;
            display: inline-block;
            padding-bottom: 10px;
        }

        .section-title h2::after {
            content: '';
            position: absolute;
            width: 70px;
            height: 3px;
            background-color: var(--primary-color);
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
        }

        /* About Section */
        .about-content {
            display: flex;
            align-items: center;
            gap: 50px;
        }

        .about-img {
            flex: 1;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .about-img img {
            width: 100%;
            height: auto;
            display: block;
            transition: var(--transition);
        }

        .about-img:hover img {
            transform: scale(1.05);
        }

        .about-text {
            flex: 1;
        }

        .about-text h3 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            color: var(--text-color);
        }

        .about-text p {
            margin-bottom: 1.5rem;
            color: var(--text-muted);
        }

        /* Skills Section */
        .skills-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 30px;
        }

        .skill-card {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: var(--shadow);
            transition: var(--transition);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .skill-card:hover {
            transform: translateY(-10px);
        }

        .skill-icon {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        .skill-card h3 {
            margin-bottom: 1rem;
            color: var(--text-color);
        }

        .skill-card p {
            color: var(--text-muted);
        }

        /* Projects Section */
        .projects-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
        }

        .project-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .project-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
        }

        .project-img {
            height: 200px;
            overflow: hidden;
        }

        .project-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }

        .project-card:hover .project-img img {
            transform: scale(1.1);
        }

        .project-info {
            padding: 25px;
        }

        .project-info h3 {
            margin-bottom: 10px;
            color: var(--text-color);
            font-size: 1.3rem;
        }

        .project-info p {
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 15px 0;
        }

        .project-tag {
            background-color: rgba(108, 99, 255, 0.2);
            color: var(--primary-color);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        /* Contact Section */
        .contact {
            background-color: var(--secondary-color);
        }

        .contact .section-title h2 {
            color: var(--text-color);
        }

        .contact-content {
            display: flex;
            gap: 50px;
        }

        .contact-info {
            flex: 1;
        }

        .contact-item {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
        }

        .contact-icon {
            font-size: 1.5rem;
            color: var(--primary-color);
            margin-right: 15px;
            width: 50px;
            height: 50px;
            background-color: rgba(108, 99, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .contact-details h3 {
            margin-bottom: 5px;
            color: var(--text-color);
        }

        .contact-details p {
            color: var(--text-muted);
        }

        .contact-form {
            flex: 1;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-control {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 5px;
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-color);
            font-size: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .form-control::placeholder {
            color: var(--text-muted);
        }

        textarea.form-control {
            min-height: 150px;
            resize: vertical;
        }

        /* Footer */
        footer {
            background-color: var(--dark-bg);
            color: white;
            text-align: center;
            padding: 50px 0 30px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .social-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            color: white;
            text-decoration: none;
            transition: var(--transition);
            font-size: 1.2rem;
        }

        .social-link:hover {
            background-color: var(--primary-color);
            transform: translateY(-5px);
        }

        .copyright {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Responsive Styles */
        @media (max-width: 992px) {
            .hero-content {
                flex-direction: column-reverse;
                text-align: center;
            }
            
            .hero-text {
                text-align: center;
            }
            
            .about-content {
                flex-direction: column;
            }
            
            .contact-content {
                flex-direction: column;
            }
        }

        @media (max-width: 768px) {
            .nav-links {
                position: fixed;
                top: 70px;
                right: -100%;
                background-color: var(--card-bg);
                width: 80%;
                height: calc(100vh - 70px);
                flex-direction: column;
                align-items: center;
                justify-content: flex-start;
                padding-top: 50px;
                transition: var(--transition);
                box-shadow: -5px 0 15px rgba(0, 0, 0, 0.3);
            }

            .nav-links.active {
                right: 0;
            }

            .nav-links li {
                margin: 15px 0;
            }

            .hamburger {
                display: block;
            }

            .hero-text h1 {
                font-size: 2.5rem;
            }

            .hero-text .title {
                font-size: 1.5rem;
            }

            .section-title h2 {
                font-size: 2rem;
            }

            .profile-container {
                width: 280px;
                height: 280px;
            }

            .profile-image {
                width: 270px;
                height: 270px;
            }
        }

        @media (max-width: 576px) {
            .hero-text h1 {
                font-size: 2rem;
            }
            
            .hero-text p {
                font-size: 1rem;
            }
            
            .skills-container, .projects-container {
                grid-template-columns: 1fr;
            }

            .hero-buttons {
                flex-direction: column;
                align-items: center;
            }

            .btn {
                width: 100%;
                max-width: 250px;
            }

            .profile-container {
                width: 250px;
                height: 250px;
            }

            .profile-image {
                width: 240px;
                height: 240px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // React Components
        const { useState, useEffect } = React;

        // Header Component
        function Header() {
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            
            const toggleMenu = () => {
                setIsMenuOpen(!isMenuOpen);
            };
            
            return (
                <header>
                    <div className="container">
                        <div className="header-content">
                            <a href="#" className="logo">Siva<span>Prabha</span></a>
                            <ul className={`nav-links ${isMenuOpen ? 'active' : ''}`}>
                                <li><a href="#home" onClick={toggleMenu}>Home</a></li>
                                <li><a href="#about" onClick={toggleMenu}>About</a></li>
                                <li><a href="#skills" onClick={toggleMenu}>Skills</a></li>
                                <li><a href="#projects" onClick={toggleMenu}>Projects</a></li>
                                <li><a href="#contact" onClick={toggleMenu}>Contact</a></li>
                            </ul>
                            <div className="hamburger" onClick={toggleMenu}>
                                <i className={`fas ${isMenuOpen ? 'fa-times' : 'fa-bars'}`}></i>
                            </div>
                        </div>
                    </div>
                </header>
            );
        }

        // Hero Component
        function Hero() {
            return (
                <section className="hero" id="home">
                    <div className="container">
                        <div className="hero-content">
                            <div className="hero-text">
                                <p className="greeting">Hello, I'm</p>
                                <h1>Siva<span>prabhakaran</span></h1>
                                <div className="title">AI & Data Science Student</div>
                                <p>I'm a B.Tech Artificial Intelligence and Data Science student passionate about AI, Machine Learning, and creating intelligent digital solutions.</p>
                                <div className="hero-buttons">
                                    <a href="#contact" className="btn btn-primary">Let's Talk</a>
                                    <a href="#projects" className="btn btn-secondary">My Projects</a>
                                </div>
                            </div>
                            <div className="hero-image">
                                <div className="profile-container">
                                    <div className="profile-image">
                                        <img src="./assets/profile.jpg" alt="Sivaprabhakaran" />
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        }

        // About Component
        function About() {
            return (
                <section className="section" id="about">
                    <div className="container">
                        <div className="section-title">
                            <h2>About Me</h2>
                        </div>
                        <div className="about-content">
                            <div className="about-img">
                                <img src="./assets/profile.jpg" alt="About Me" />


                            </div>
                            <div className="about-text">
                                <h3>AI & Data Science Student</h3>
                                <p>I'm a B.Tech Artificial Intelligence and Data Science student at Sri Ramakrishna Engineering College, Coimbatore. I'm passionate about AI, Machine Learning, and Web Development, and I enjoy creating intelligent and user-friendly digital solutions.</p>
                                <p>My academic journey has equipped me with a strong foundation in data structures, algorithms, machine learning models, and software development. I'm constantly exploring new technologies and methodologies to enhance my skills.</p>
                                <p>I believe in the power of technology to solve real-world problems and am eager to contribute to innovative projects that make a difference.</p>
                                <a href="#contact" className="btn btn-primary">Get In Touch</a>
                            </div>
                        </div>
                    </div>
                </section>
            );
        }

        // Skills Component
        function Skills() {
            const skills = [
                { icon: 'fab fa-python', name: 'Python', description: 'Data analysis, machine learning, and automation scripting' },
                { icon: 'fas fa-robot', name: 'Machine Learning', description: 'Supervised & unsupervised learning, neural networks' },
                { icon: 'fas fa-database', name: 'SQL', description: 'Database design, querying, and management' },
                { icon: 'fab fa-js-square', name: 'JavaScript', description: 'Frontend development and interactive web applications' },
                { icon: 'fab fa-react', name: 'React', description: 'Component-based UI development' },
                { icon: 'fas fa-chart-line', name: 'Data Visualization', description: 'Creating insightful charts and dashboards' }
            ];
            
            return (
                <section className="section" id="skills">
                    <div className="container">
                        <div className="section-title">
                            <h2>My Skills</h2>
                        </div>
                        <div className="skills-container">
                            {skills.map((skill, index) => (
                                <div className="skill-card" key={index}>
                                    <div className="skill-icon">
                                        <i className={skill.icon}></i>
                                    </div>
                                    <h3>{skill.name}</h3>
                                    <p>{skill.description}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        }

        // Projects Component
        function Projects() {
            const projects = [
                { 
                    title: 'Adversarial Media Forensics System', 
                    description: 'A deep learning-based system to detect and analyze manipulated media, enhancing trust and authenticity in digital images and videos.',
                    tags: ['Python', 'TensorFlow', 'OpenCV', 'Flask'],
                    image: 'https://images.unsplash.com/photo-1555949963-aa79dcee981c?auto=format&fit=crop&w=1170&q=80'
                },
                { 
                    title: 'Smart Shopping Trolley', 
                    description: 'An AI-powered shopping system using object detection and load sensors for automated billing and weight verification in retail environments.',
                    tags: ['YOLO', 'Raspberry Pi', 'Flask', 'JavaScript'],
                    image: 'https://media.istockphoto.com/id/2214941197/vector/smart-retail-and-digital-shopping-concept-with-glowing-cart-and-circuit-board-vector.jpg?s=612x612&w=0&k=20&c=sDI_AulnV5b-_JWKM146dnpQrO8c9jLIE4aHY6SL1bk='
                },
                { 
                    title: 'Mono-Secure Multi-Owner Data Sharing', 
                    description: 'A cryptography-based secure data-sharing system supporting multiple owners in a dynamic group with access control and confidentiality.',
                    tags: ['Python', 'Cryptography', 'Data Security'],
                    image: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT0KCZKIXwUyJz9KOKm6G1NFZ0vAgWLsS_N9A&s'
                }
            ];
            
            return (
                <section className="section" id="projects">
                    <div className="container">
                        <div className="section-title">
                            <h2>My Projects</h2>
                        </div>
                        <div className="projects-container">
                            {projects.map((project, index) => (
                                <div className="project-card" key={index}>
                                    <div className="project-img">
                                        <img src={project.image} alt={project.title} />
                                    </div>
                                    <div className="project-info">
                                        <h3>{project.title}</h3>
                                        <p>{project.description}</p>
                                        <div className="project-tags">
                                            {project.tags.map((tag, tagIndex) => (
                                                <span className="project-tag" key={tagIndex}>{tag}</span>
                                            ))}
                                        </div>
                                        <a href="#" className="btn btn-primary">View Project</a>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        }

        // Contact Component
        function Contact() {
            const [formData, setFormData] = useState({
                name: '',
                email: '',
                subject: '',
                message: ''
            });
            
            const handleChange = (e) => {
                setFormData({
                    ...formData,
                    [e.target.name]: e.target.value
                });
            };
            
            const handleSubmit = (e) => {
                e.preventDefault();
                alert('Thank you for your message! I will get back to you soon.');
                setFormData({
                    name: '',
                    email: '',
                    subject: '',
                    message: ''
                });
            };
            
            return (
                <section className="section contact" id="contact">
                    <div className="container">
                        <div className="section-title">
                            <h2>Contact Me</h2>
                        </div>
                        <div className="contact-content">
                            <div className="contact-info">
                                <div className="contact-item">
                                    <div className="contact-icon">
                                        <i className="fas fa-map-marker-alt"></i>
                                    </div>
                                    <div className="contact-details">
                                        <h3>Location</h3>
                                        <p>Coimbatore, Tamil Nadu</p>
                                    </div>
                                </div>
                                <div className="contact-item">
                                    <div className="contact-icon">
                                        <i className="fas fa-envelope"></i>
                                    </div>
                                    <div className="contact-details">
                                        <h3>Email</h3>
                                        <p>sivaprabha@example.com</p>
                                    </div>
                                </div>
                                <div className="contact-item">
                                    <div className="contact-icon">
                                        <i className="fas fa-phone"></i>
                                    </div>
                                    <div className="contact-details">
                                        <h3>Phone</h3>
                                        <p>+91 9766453434</p>
                                    </div>
                                </div>
                            </div>
                            <div className="contact-form">
                                <form onSubmit={handleSubmit}>
                                    <div className="form-group">
                                        <input 
                                            type="text" 
                                            className="form-control" 
                                            placeholder="Your Name" 
                                            name="name"
                                            value={formData.name}
                                            onChange={handleChange}
                                            required
                                        />
                                    </div>
                                    <div className="form-group">
                                        <input 
                                            type="email" 
                                            className="form-control" 
                                            placeholder="Your Email" 
                                            name="email"
                                            value={formData.email}
                                            onChange={handleChange}
                                            required
                                        />
                                    </div>
                                    <div className="form-group">
                                        <input 
                                            type="text" 
                                            className="form-control" 
                                            placeholder="Subject" 
                                            name="subject"
                                            value={formData.subject}
                                            onChange={handleChange}
                                            required
                                        />
                                    </div>
                                    <div className="form-group">
                                        <textarea 
                                            className="form-control" 
                                            placeholder="Your Message" 
                                            name="message"
                                            value={formData.message}
                                            onChange={handleChange}
                                            required
                                        ></textarea>
                                    </div>
                                    <button type="submit" className="btn btn-primary">Send Message</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </section>
            );
        }

        // Footer Component
        function Footer() {
            return (
                <footer>
                    <div className="container">
                        <div className="social-links">
                            <a href="#" className="social-link"><i className="fab fa-github"></i></a>
                            <a href="#" className="social-link"><i className="fab fa-linkedin-in"></i></a>
                            <a href="#" className="social-link"><i className="fab fa-twitter"></i></a>
                            <a href="#" className="social-link"><i className="fab fa-instagram"></i></a>
                        </div>
                        <p className="copyright">&copy; 2023 Sivaprabhakaran. All Rights Reserved.</p>
                    </div>
                </footer>
            );
        }

        // Main App Component
        function App() {
            useEffect(() => {
                // Smooth scrolling for anchor links
                const anchorLinks = document.querySelectorAll('a[href^="#"]');
                
                anchorLinks.forEach(link => {
                    link.addEventListener('click', function(e) {
                        e.preventDefault();
                        
                        const targetId = this.getAttribute('href');
                        if (targetId === '#') return;
                        
                        const targetElement = document.querySelector(targetId);
                        if (targetElement) {
                            window.scrollTo({
                                top: targetElement.offsetTop - 70,
                                behavior: 'smooth'
                            });
                        }
                    });
                });
                
                // Close mobile menu when clicking on a link
                const navLinks = document.querySelectorAll('.nav-links a');
                
                navLinks.forEach(link => {
                    link.addEventListener('click', () => {
                        document.querySelector('.nav-links').classList.remove('active');
                        document.querySelector('.hamburger i').classList.replace('fa-times', 'fa-bars');
                    });
                });
            }, []);
            
            return (
                <div>
                    <Header />
                    <Hero />
                    <About />
                    <Skills />
                    <Projects />
                    <Contact />
                    <Footer />
                </div>
            );
        }

        // Render the App
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
